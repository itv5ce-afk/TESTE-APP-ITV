<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITVPlayer - Admin Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* ========== MATRIX BACKGROUND ========== */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
            pointer-events: none;
        }
        
        .navbar { 
            background-color: rgba(17, 17, 17, 0.95); 
            border-bottom: 1px solid #333; 
            position: relative;
            z-index: 10;
        }
        .card-cliente {             
            background-color: rgba(26, 26, 26, 0.95); 
            border: 1px solid #333;             border-radius: 8px; 
            margin-bottom: 10px; 
            padding: 15px; 
            position: relative;
            z-index: 5;
            backdrop-filter: blur(2px);
        }
        .btn-small { font-size: 0.7rem; padding: 5px; flex: 1; margin: 2px; border: none; color: white; }
        .bg-lilas { background-color: #9933ff !important; color: white; }
        #adminLock { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            z-index: 9999; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        .menu-lateral { 
            height: 100%; 
            width: 0; 
            position: fixed; 
            z-index: 1000; 
            top: 0; 
            left: 0; 
            background-color: rgba(17, 17, 17, 0.98); 
            overflow-x: hidden; 
            transition: 0.5s; 
            padding-top: 60px; 
            border-right: 1px solid #333;
        }
        .menu-lateral a, .menu-lateral label { 
            padding: 8px 32px; 
            text-decoration: none; 
            font-size: 18px; 
            color: #818181; 
            display: block; 
            position: relative;
            z-index: 1001;
        }
        
        .card-financeiro {             
            background: rgba(34, 34, 34, 0.95); 
            border-left: 4px solid #9933ff; 
            border-radius: 5px;             padding: 15px; 
            margin-bottom: 15px;
            backdrop-filter: blur(2px);
            position: relative;
            z-index: 5;
        }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #00ff00; }
        .stat-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }

        .dropdown-menu { 
            background-color: rgba(44, 44, 44, 0.98); 
            border: 1px solid #444; 
            z-index: 1050;
        }
        .dropdown-item { color: #fff; }
        .dropdown-item:hover { background-color: #444; color: #fff; }
        .btn-group .btn { margin: 0 2px; }
        
        .form-control, .form-select {
            background-color: rgba(30, 30, 30, 0.95) !important;
            border: 1px solid #444 !important;
            color: #fff !important;
            position: relative;
            z-index: 5;
        }
        .form-control::placeholder { color: #888 !important; }
        
        .modal-content {
            background-color: rgba(26, 26, 26, 0.98) !important;
            border: 1px solid #444;
            position: relative;
            z-index: 1050;
        }
        
        .btn { position: relative; z-index: 5; }
        .container { position: relative; z-index: 5; }

        /* ========== TELA DE LOGIN FIREBASE ========== */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;        }
        #loginCard {
            background: rgba(26, 26, 26, 0.98);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(153, 51, 255, 0.3);
        }
        #loginCard h3 {
            color: #9933ff;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #loginCard .form-control {
            margin-bottom: 15px;
        }
        #loginCard .btn-login {
            background: linear-gradient(135deg, #9933ff, #6600cc);
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
        }
        #loginCard .btn-login:hover {
            background: linear-gradient(135deg, #6600cc, #9933ff);
        }
        #loginCard .alert {
            font-size: 0.9rem;
        }
        #loginCard .forgot-pass {
            text-align: center;
            margin-top: 10px;
        }
        #loginCard .forgot-pass a {
            color: #9933ff;
            text-decoration: none;
            font-size: 0.85rem;
        }
        #loginCard .forgot-pass a:hover {
            text-decoration: underline;
        }
        /* Loading spinner */
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;        }
        /* Botão sair */
        #btnLogout {
            background-color: #dc3545 !important;
            border: none;
        }
        #btnLogout:hover {
            background-color: #bb2d3b !important;
        }
        /* ========== FIM LOGIN ========== */
    </style>
</head>
<body>

<!-- Canvas para efeito Matrix -->
<canvas id="matrixCanvas"></canvas>

<!-- ========== TELA DE LOGIN FIREBASE ========== -->
<div id="loginScreen">
    <div id="loginCard" class="animate__animated animate__fadeIn">
        <h3><i class="bi bi-shield-lock"></i> ITVPlayer Admin</h3>
        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
        
        <form id="loginForm">

            <label class="small text-secondary">Senha:</label>

                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('loginPass', this)">

            <button type="submit" id="btnLoginSubmit" class="btn btn-login mt-3">
                <span id="loginText">ENTRAR</span>

        <div class="forgot-pass">

        <hr class="border-secondary my-3">
        
        <div class="text-center small text-secondary">
            <i class="bi bi-fire"></i> Protegido por Firebase Authentication

<!-- ========== FIM LOGIN ========== -->

<div id="mySidenav" class="menu-lateral">

</div>

<nav class="navbar sticky-top">
    <div class="container-fluid">
        <button class="btn text-white" onclick="openNav()"><i class="bi bi-list fs-3"></i></button>

        <div>
            <button class="btn btn-outline-info me-2" onclick="toggleAdminPanel()"><i class="bi bi-graph-up"></i></button>

            <div class="col-6 col-md-3">

    <input type="text" id="search" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Buscar cliente..." onkeyup="renderClientes()">

                <button class="btn btn-success w-100" onclick="saveCliente()">Salvar Cliente</button>

</div>

<!-- ========== FIREBASE SDKs ========== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- ========== FIM FIREBASE ========== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ========== CONFIGURAÇÃO FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyDd_rtYsto9_0zp8pxYwXRs4XRRip7k3uc",
        authDomain: "itvcontrol.firebaseapp.com",
        projectId: "itvcontrol",
        storageBucket: "itvcontrol.firebasestorage.app",
        messagingSenderId: "291731890067",
        appId: "1:291731890067:web:e75e79766765d861db5266"
    };
    
    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Configura persistência (mantém login mesmo fechando o navegador)
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    // ========== FIM FIREBASE ==========

    // ========== MATRIX RAIN EFFECT ==========
    (function initMatrix() {
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
                function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const matrixChars = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const chars = matrixChars.split('');
        
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = [];
        
        for(let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }
        
        const speed = 0.4;
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00FF41';
            ctx.font = `${fontSize}px monospace`;
            
            for(let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                
                const opacity = Math.min(1, Math.max(0.3, (canvas.height - y) / (canvas.height * 0.3)));
                ctx.fillStyle = `rgba(0, 255, 65, ${opacity})`;
                
                ctx.fillText(char, x, y);
                
                drops[i] += speed;
                
                if(drops[i] * fontSize > canvas.height + fontSize && Math.random() > 0.975) {
                    drops[i] = Math.random() * -20;
                }
            }
            
            requestAnimationFrame(draw);
        }
        
        draw();
    })();
    // ========== FIM MATRIX ==========
    // ========== VARIÁVEIS GLOBAIS ==========
    let clientes = JSON.parse(localStorage.getItem('itv_clientes')) || [];
    let config = JSON.parse(localStorage.getItem('itv_config')) || { msg: "", p1: "", p2: "", p3: "" };
    let isUnlocked = localStorage.getItem('itv_unlocked') === 'true';
    let currentFilter = 'ativos';
    let currentUser = null; // Usuário logado do Firebase
    // ========== FIM VARIÁVEIS ==========

    // ========== FUNÇÕES DE LOGIN FIREBASE ==========
    
    // Mostrar/ocultar senha
    function togglePass(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if(input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
    
    // Login com Firebase
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        const alertBox = document.getElementById('loginAlert');
        const btnSubmit = document.getElementById('btnLoginSubmit');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        
        // UI loading
        alertBox.classList.add('d-none');
        btnSubmit.disabled = true;
        loginText.textContent = 'ENTRANDO...';
        loginSpinner.classList.remove('d-none');
        
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            currentUser = userCredential.user;
            
            // Sucesso: carregar dados do Firestore e mostrar app
            await loadUserDataFromFirebase();
            hideLoginScreen();
            
        } catch (error) {            console.error('Erro no login:', error);
            let msg = 'Falha no login. Verifique e-mail e senha.';
            
            if(error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
            else if(error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
            else if(error.code === 'auth/invalid-email') msg = 'E-mail inválido.';
            else if(error.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
            
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        } finally {
            // Restaura UI
            btnSubmit.disabled = false;
            loginText.textContent = 'ENTRAR';
            loginSpinner.classList.add('d-none');
        }
    });
    
    // Carregar dados do usuário do Firestore
    async function loadUserDataFromFirebase() {
        if(!currentUser) return;
        
        try {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            
            if(userDoc.exists) {
                const data = userDoc.data();
                // Carrega clientes se existirem no Firestore
                if(data.clientes && Array.isArray(data.clientes)) {
                    clientes = data.clientes;
                    localStorage.setItem('itv_clientes', JSON.stringify(clientes));
                }
                // Carrega configurações
                if(data.config) {
                    config = data.config;
                    localStorage.setItem('itv_config', JSON.stringify(config));
                }
            }
            // Se não existir documento, cria um vazio
            await saveUserDataToFirebase();
            
        } catch (error) {
            console.error('Erro ao carregar dados:', error);
            // Continua com dados do localStorage se falhar
        }
    }
    
    // Salvar dados do usuário no Firestore
    async function saveUserDataToFirebase() {
        if(!currentUser) return;        
        try {
            await db.collection('users').doc(currentUser.uid).set({
                email: currentUser.email,
                clientes: clientes,
                config: config,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        } catch (error) {
            console.error('Erro ao salvar dados:', error);
        }
    }
    
    // Esconder tela de login e mostrar app
    function hideLoginScreen() {
        document.getElementById('loginScreen').style.display = 'none';
        // Inicializa interface
        renderClientes();
        document.getElementById('cfgMsg').value = config.msg || '';
        document.getElementById('url1').value = config.p1 || '';
        document.getElementById('url2').value = config.p2 || '';
        document.getElementById('url3').value = config.p3 || '';
    }
    
    // Logout do Firebase
    function logoutFirebase() {
        if(confirm('Deseja realmente sair?')) {
            auth.signOut().then(() => {
                currentUser = null;
                // Opcional: limpar dados locais ao sair
                // localStorage.clear();
                location.reload();
            }).catch(error => {
                console.error('Erro ao sair:', error);
                alert('Erro ao sair. Tente novamente.');
            });
        }
    }
    
    // Recuperar senha
    function recoverPassword() {
        const email = prompt('Digite seu e-mail cadastrado para recuperar a senha:');
        if(email) {
            auth.sendPasswordResetEmail(email)
                .then(() => alert('E-mail de recuperação enviado! Verifique sua caixa de entrada.'))
                .catch(error => {
                    let msg = 'Erro ao enviar e-mail.';
                    if(error.code === 'auth/user-not-found') msg = 'E-mail não cadastrado.';
                    alert(msg);
                });        }
    }
    
    // Listener de estado de autenticação
    auth.onAuthStateChanged(user => {
        if(user) {
            currentUser = user;
            // Se já estiver na página principal, não faz nada
            if(document.getElementById('loginScreen').style.display !== 'none') {
                loadUserDataFromFirebase().then(() => hideLoginScreen());
            }
        } else {
            // Usuário não autenticado: mostra login
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'flex';
        }
    });
    
    // ========== FIM FUNÇÕES LOGIN ==========

    // Função auxiliar para converter data ISO (YYYY-MM-DD) para DD/MM/AAAA
    function formatDateToBR(isoDate) {
        if (!isoDate) return '';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    // Função auxiliar para converter data DD/MM/AAAA para ISO (YYYY-MM-DD) ao salvar
    function parseDateBRtoISO(brDate) {
        if (!brDate) return '';
        const parts = brDate.split('/');
        if (parts.length !== 3) return brDate;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function checkLock() {
        // Bloqueio desabilitado
        return;
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if(panel.style.display === 'block') renderFinanceiro();
    }

    function unlockApp() {
        if (document.getElementById('adminPass').value === 'itv2026001') {
            isUnlocked = true;            localStorage.setItem('itv_unlocked', 'true');
            document.getElementById('adminLock').style.display = 'none';
        } else { alert("Senha incorreta!"); }
    }

    function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
    function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

    function saveSettings() {
        config = {
            msg: document.getElementById('cfgMsg').value,
            p1: document.getElementById('url1').value,
            p2: document.getElementById('url2').value,
            p3: document.getElementById('url3').value
        };
        localStorage.setItem('itv_config', JSON.stringify(config));
        // Salva também no Firebase se estiver logado
        saveUserDataToFirebase();
        closeNav();
        alert('Configurações salvas! ✓');
    }

    function showModalCadastro(index = -1) {
        if(index === -1) {
            document.getElementById('editIndex').value = "";
            document.getElementById('cNome').value = "";
            document.getElementById('cUser').value = "";
            document.getElementById('cPass').value = "";
            document.getElementById('cValor').value = "";
            document.getElementById('cData').value = "";
            document.getElementById('cServ').value = "";
            document.getElementById('cUrl').value = "";
            document.getElementById('cTel').value = "";
            document.getElementById('cObs').value = "";
        } else {
            const c = clientes[index];
            document.getElementById('cNome').value = c.nome;
            document.getElementById('cUser').value = c.user;
            document.getElementById('cPass').value = c.pass;
            document.getElementById('cValor').value = c.valor;
            document.getElementById('cData').value = c.data;
            document.getElementById('cServ').value = c.serv;
            document.getElementById('cUrl').value = c.url;
            document.getElementById('cTel').value = c.tel;
            document.getElementById('cObs').value = c.obs;
        }
        new bootstrap.Modal(document.getElementById('modalCadastro')).show();
    }

    function saveCliente() {        const index = document.getElementById('editIndex').value;
        const novo = {
            nome: document.getElementById('cNome').value,
            user: document.getElementById('cUser').value,
            pass: document.getElementById('cPass').value,
            valor: parseFloat(document.getElementById('cValor').value) || 0,
            data: document.getElementById('cData').value,
            serv: document.getElementById('cServ').value,
            url: document.getElementById('cUrl').value,
            tel: document.getElementById('cTel').value,
            obs: document.getElementById('cObs').value,
            status: 'ativo'
        };

        if(index === "") clientes.push(novo);
        else {
            novo.status = clientes[index].status;
            clientes[index] = novo;
        }

        localStorage.setItem('itv_clientes', JSON.stringify(clientes));
        // Salva também no Firebase se estiver logado
        saveUserDataToFirebase();
        location.reload();
    }

    function renderFinanceiro() {
        const mesSelecionado = document.getElementById('filterMes').value;
        let recebido = 0;
        let pendente = 0;
        let totalGeral = 0;
        let totalAtivos = 0;

        clientes.forEach(c => {
            if(c.status !== 'deletado') {
                const val = parseFloat(c.valor) || 0;
                totalGeral += val;
                totalAtivos++;
                
                if(c.data && c.data.startsWith(mesSelecionado)) {
                    if(c.status === 'ativo' || c.status === 'vencer' || c.status === 'expirado') {
                        recebido += val;
                    } else if(c.status === 'apagar') {
                        pendente += val;
                    }
                }
            }
        });

        document.getElementById('finRecebido').innerText = `R$ ${recebido.toFixed(2)}`;        document.getElementById('finPendente').innerText = `R$ ${pendente.toFixed(2)}`;
        document.getElementById('finTotalClientes').innerText = totalAtivos;
        document.getElementById('finGeral').innerText = `R$ ${totalGeral.toFixed(2)}`;
    }

    function pagarCliente(i) {
        const cliente = clientes[i];
        const msg = `✅𝕊𝔼𝕌 ℙ𝔸𝔾𝔸𝕄𝔼ℕ𝕋𝕆 𝔽𝕆𝕀 ℂ𝕆ℕ𝔽𝕀ℝ𝕄𝔸𝔻𝕆𝕊!!\n\nNome: ${cliente.nome}\nPlano Familia: R$ ${cliente.valor.toFixed(2)}\nProvedor: ${cliente.serv}\nUsuário: ${cliente.user}\nSenha: ${cliente.pass}\nUrl: ${cliente.url}\nVence: ${formatDateToBR(cliente.data)}\n\nDivirta-se!!`;
        window.open(`https://wa.me/${cliente.tel.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`);
        cliente.status = 'ativo';
        localStorage.setItem('itv_clientes', JSON.stringify(clientes));
        saveUserDataToFirebase();
        renderClientes();
    }

    function renderClientes() {
        const lista = document.getElementById('listaClientes');
        const search = document.getElementById('search').value.toLowerCase();
        lista.innerHTML = "";
        
        let counts = { ativos: 0, vencer: 0, exp: 0, apagar: 0, del: 0 };
        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        clientes.forEach((c, i) => {
            // Verifica se a data é válida
            const dataVenc = c.data ? new Date(c.data) : new Date();
            if(isNaN(dataVenc.getTime())) dataVenc.setTime(0);
            dataVenc.setHours(0,0,0,0);
            const diffDays = Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
            
            let statusReal = c.status;
            if(c.status !== 'deletado' && c.status !== 'apagar') {
                if(diffDays < 0) statusReal = 'expirado';
                else if(diffDays <= 3) statusReal = 'vencer';
                else statusReal = 'ativo';
            }

            if(statusReal === 'ativo') counts.ativos++;
            if(statusReal === 'vencer') counts.vencer++;
            if(statusReal === 'expirado') counts.exp++;
            if(c.status === 'apagar') counts.apagar++;
            if(c.status === 'deletado') counts.del++;

            if(currentFilter === 'ativos' && (statusReal === 'deletado' || statusReal === 'expirado' || statusReal === 'apagar')) return;
            if(currentFilter === 'vencer' && statusReal !== 'vencer') return;
            if(currentFilter === 'expirados' && statusReal !== 'expirado') return;
            if(currentFilter === 'apagar' && c.status !== 'apagar') return;
            if(currentFilter === 'deletados' && c.status !== 'deletado') return;
                        if(!c.nome || !c.nome.toLowerCase().includes(search)) return;

            const dataFormatada = formatDateToBR(c.data);
            const valorFormatado = `R$ ${(c.valor || 0).toFixed(2)}`;

            let botoesHtml = '';
            if (c.status === 'apagar') {
                botoesHtml = `
                    <div class="d-flex flex-wrap gap-1">
                        <button class="btn btn-sm btn-primary" onclick="pagarCliente(${i})">PAGAR</button>
                        <button class="btn btn-sm bg-lilas" onclick="editCliente(${i})"><i class="bi bi-pencil"></i> EDITAR</button>
                    </div>
                `;
            } else {
                botoesHtml = `
                    <div class="d-flex flex-wrap gap-1">
                        <button class="btn btn-sm btn-success" onclick="sendZap('${i}', 'cobranca')">COBRAR</button>
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-warning dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                RENOVAR
                            </button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" onclick="updateStatus('${i}', 'pago')">✅ PAGO</button></li>
                                <li><button class="dropdown-item" onclick="updateStatus('${i}', 'naopago')">❌ NÃO PAGO</button></li>
                            </ul>
                        </div>
                        <button class="btn btn-sm bg-lilas" onclick="editCliente(${i})"><i class="bi bi-pencil"></i></button>
                        ${c.status === 'deletado' ? 
                            `<button class="btn btn-sm btn-info" onclick="restore(${i})">RESTAURAR</button>
                             <button class="btn btn-sm btn-danger" onclick="hardDelete(${i})">EXCLUIR</button>` : 
                            `<button class="btn btn-sm btn-danger" onclick="softDelete(${i})"><i class="bi bi-trash"></i></button>`
                        }
                    </div>
                `;
            }

            lista.innerHTML += `
                <div class="card-cliente">
                    <div class="d-flex justify-content-between">
                        <h5>${c.nome || 'Sem nome'}</h5>
                        <span class="badge ${statusReal === 'expirado' ? 'bg-danger' : (statusReal === 'vencer' ? 'bg-warning' : 'bg-success')}">${dataFormatada || '--/--/----'}</span>
                    </div>
                    <p class="small mb-2">User: ${c.user || '-'} | Valor: <strong>${valorFormatado}</strong></p>
                    ${botoesHtml}
                </div>
            `;
        });

        document.getElementById('countAtivos').innerText = counts.ativos;
        document.getElementById('countVencer').innerText = counts.vencer;        document.getElementById('countExp').innerText = counts.exp;
        document.getElementById('countPagar').innerText = counts.apagar;
        document.getElementById('countDel').innerText = counts.del;
        renderFinanceiro();
    }

    function sendZap(i, tipo) {
        const c = clientes[i];
        if(!c || !c.tel) { alert('Telefone do cliente não cadastrado!'); return; }
        
        let msg = "";
        const novaData = new Date();
        novaData.setMonth(novaData.getMonth() + 1);
        const dataFormatada = formatDateToBR(c.data);
        const novaDataFormatada = formatDateToBR(novaData.toISOString().split('T')[0]);

        if(tipo === 'cobranca') {
            msg = `📩 𝕞𝕤𝕘-𝕒𝕦𝕥𝕠𝕞á𝕥𝕚𝕔𝕒📩\n🚨🚨🚨🚨🚨🚨🚨🚨\n\nOla ${c.nome || 'Cliente'}!!\nSou o assistente virtual da ITVPlayer 🤖\n\nSua lista de\nTV, FILMES & SÉRIES\nexpirou ${dataFormatada}\n\nPara renovar Faz um Pix 💠\n💰Plano Familia: R$:${(c.valor || 0).toFixed(2)}\n${config.msg || ''}`;
        } else if(tipo === 'pago') {
            msg = `✅𝕊𝔼𝕌 ℙ𝔸𝔾𝔸𝕄𝔼ℕ𝕋𝕆 𝔽𝕆𝕀 ℂ𝕆ℕ𝔽𝕀ℝ𝕄𝔸𝔻𝕆𝕊!!\n\nNome: ${c.nome}\nPlano Familia: R$ ${(c.valor || 0).toFixed(2)}\nProvedor: ${c.serv}\nUsuário: ${c.user}\nSenha: ${c.pass}\nUrl: ${c.url}\nVence: ${novaDataFormatada}\n\nDivirta-se!!`;
        } else {
            msg = `⛔️𝕊𝔼𝕌 ℙ𝔸𝔾𝔸𝕄𝔼ℕ𝕋𝕆 ℕ𝔸𝕆 𝔽𝕆𝕀 ℂ𝕆ℕ𝔽𝕀ℝ𝕄𝔸𝔻𝕆𝕊!!\n\nNome: ${c.nome}\nPlano Familia: R$ ${(c.valor || 0).toFixed(2)}\nProvedor: ${c.serv}\nUsuário: ${c.user}\nSenha: ${c.pass}\nUrl: ${c.url}\nVence: ${novaDataFormatada}\n\nDivirta-se!!`;
        }
        
        window.open(`https://wa.me/${c.tel.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`);
    }

    function updateStatus(i, acao) {
        const dataAtual = new Date(clientes[i].data || Date.now());
        dataAtual.setMonth(dataAtual.getMonth() + 1);
        clientes[i].data = dataAtual.toISOString().split('T')[0];
        
        if(acao === 'pago') {
            clientes[i].status = 'ativo';
            sendZap(i, 'pago');
        } else {
            clientes[i].status = 'apagar';
            sendZap(i, 'naopago');
        }
        localStorage.setItem('itv_clientes', JSON.stringify(clientes));
        saveUserDataToFirebase();
        renderClientes();
    }

    function filterData(f) { currentFilter = f; renderClientes(); }
    function softDelete(i) { clientes[i].status = 'deletado'; localStorage.setItem('itv_clientes', JSON.stringify(clientes)); saveUserDataToFirebase(); renderClientes(); }
    function restore(i) { clientes[i].status = 'ativo'; localStorage.setItem('itv_clientes', JSON.stringify(clientes)); saveUserDataToFirebase(); renderClientes(); }
    function hardDelete(i) { if(confirm("Excluir permanentemente?")) { clientes.splice(i, 1); localStorage.setItem('itv_clientes', JSON.stringify(clientes)); saveUserDataToFirebase(); renderClientes(); } }
    function accessPanel(n) { const url = config['p'+n]; if(url) window.open(url); else alert("Cadastre a URL no menu lateral"); }
    function editCliente(i) {
        document.getElementById('editIndex').value = i;
        const c = clientes[i];
        document.getElementById('cNome').value = c.nome || '';
        document.getElementById('cUser').value = c.user || '';
        document.getElementById('cPass').value = c.pass || '';
        document.getElementById('cValor').value = c.valor || '';
        document.getElementById('cData').value = c.data || '';
        document.getElementById('cServ').value = c.serv || '';
        document.getElementById('cUrl').value = c.url || '';
        document.getElementById('cTel').value = c.tel || '';
        document.getElementById('cObs').value = c.obs || '';
        new bootstrap.Modal(document.getElementById('modalCadastro')).show();
    }

    // Inicialização - só executa após Firebase estar pronto
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializa data do filtro de mês
        document.getElementById('filterMes').value = new Date().toISOString().slice(0, 7);
        
        // Verifica estado de autenticação (onAuthStateChanged já gerencia a UI)
    });
</script>
