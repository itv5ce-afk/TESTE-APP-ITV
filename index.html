<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WhatsApp Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #e5ddd5;
            height: 100vh;
            overflow: hidden;
        }

        /* Tela de Login */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }

        .login-container h1 {
            color: #075e54;
            text-align: center;
            margin-bottom: 10px;            font-size: 32px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-container input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        .login-container input:focus {
            border-color: #075e54;
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: #075e54;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-container button:hover {
            background: #054a3f;
        }

        .login-container .toggle-btn {
            background: transparent;
            color: #075e54;
            border: 2px solid #075e54;
        }

        .login-container .toggle-btn:hover {            background: #e8f5e9;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            text-align: center;
            margin: 10px 0;
            display: none;
        }

        /* Header Principal */
        .header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Tela Principal - Lista de Conversas */        #main-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        #main-screen.active {
            display: flex;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            background: white;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: #f5f5f5;
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .conversation-last-message {
            color: #666;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }

        .unread-badge {
            background: #25d366;
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }

        .no-conversations {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-conversations h3 {
            margin-bottom: 10px;
            color: #666;
        }

        /* Tela de Chat */
        #chat-screen {
            display: none;
            height: 100vh;
            flex-direction: column;        }

        #chat-screen.active {
            display: flex;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-contact-info {
            flex: 1;
        }

        .chat-contact-name {
            font-weight: 500;
            font-size: 18px;
        }

        .chat-contact-status {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Menu do Chat */
        .chat-menu-container {
            position: relative;        }

        .chat-menu-btn {
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .chat-menu-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: white;
            min-width: 220px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            overflow: hidden;
        }

        .chat-menu-dropdown.active {
            display: block;
        }

        .chat-menu-item {
            padding: 15px 20px;
            cursor: pointer;
            color: #333;
            font-size: 14px;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-menu-item:last-child {
            border-bottom: none;        }

        .chat-menu-item:hover {
            background: #f5f5f5;
        }

        .chat-menu-item.danger {
            color: #d32f2f;
        }

        .chat-menu-item.danger:hover {
            background: #ffebee;
        }

        .chat-menu-item input[type="file"] {
            display: none;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.sent {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-text {
            margin-bottom: 5px;            font-size: 15px;
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .message-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            margin-bottom: 5px;
            text-decoration: none;
            color: #075e54;
        }

        .message-file:hover {
            background: rgba(0,0,0,0.1);
        }

        .message-file-icon {
            font-size: 24px;
        }

        .message-file-info {
            flex: 1;
            min-width: 0;
        }

        .message-file-name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-file-size {
            font-size: 12px;
            color: #666;
        }

        .message-time {
            font-size: 11px;            color: #666;
            text-align: right;
        }

        .message-input-area {
            padding: 15px;
            background: #f0f0f0;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        .message-input-area input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .send-button {
            background: #075e54;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s;
        }

        .send-button:hover {
            background: #054a3f;
        }

        /* Modal Adicionar Contato */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #075e54;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: #075e54;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-confirm {            background: #075e54;
            color: white;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #666;
        }

        /* Animação de piscar */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .blinking {
            animation: blink 1s infinite;
        }

        /* Toast de notificação */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* Modal de visualização de imagem */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;            background: rgba(0,0,0,0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
            }

            .message {
                max-width: 85%;
            }
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #075e54;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #054a3f;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;        }
    </style>
</head>
<body>

<!-- Tela de Login -->
<div id="login-screen">
    <div class="login-container">
        <h1>💬 WhatsApp Clone</h1>
        <p class="subtitle">Conecte-se com seus amigos</p>
        <input type="email" id="login-email" placeholder="E-mail" autocomplete="email">
        <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password">
        <div id="login-error" class="error-msg"></div>
        <button id="login-btn">Entrar</button>
        <button id="register-btn" class="toggle-btn">Criar Conta</button>
    </div>
</div>

<!-- Tela Principal -->
<div id="main-screen">
    <div class="header">
        <h2>Conversas</h2>
        <div class="header-actions">
            <div class="header-btn" id="add-contact-btn" title="Adicionar Contato">➕</div>
            <div class="header-btn" id="logout-btn" title="Sair">🚪</div>
        </div>
    </div>
    <div class="conversations-list" id="conversations-list">
        <div class="loading">Carregando conversas...</div>
    </div>
</div>

<!-- Tela de Chat -->
<div id="chat-screen">
    <div class="chat-header">
        <div class="back-button" id="back-btn">⬅️</div>
        <div class="conversation-avatar" id="chat-avatar">U</div>
        <div class="chat-contact-info">
            <div class="chat-contact-name" id="chat-contact-name">Contato</div>
            <div class="chat-contact-status" id="chat-contact-status">online</div>
        </div>
        <div class="chat-menu-container">
            <div class="chat-menu-btn" id="chat-menu-btn">☰</div>
            <div class="chat-menu-dropdown" id="chat-menu-dropdown">
                <div class="chat-menu-item" id="menu-photo-btn">
                    📷 Tirar Foto
                    <input type="file" id="photo-input" accept="image/*" capture="environment">
                </div>
                <div class="chat-menu-item" id="menu-attachment-btn">
                    📎 Anexar Arquivo                    <input type="file" id="attachment-input">
                </div>
                <div class="chat-menu-item" id="menu-sound-btn">
                    🔔 Som de Notificação
                    <input type="file" id="sound-input" accept="audio/*">
                </div>
                <div class="chat-menu-item danger" id="menu-clear-btn">
                    🗑️ Limpar Mensagens
                </div>
            </div>
        </div>
    </div>
    <div class="messages-area" id="messages-area">
        <div class="loading">Carregando mensagens...</div>
    </div>
    <div class="message-input-area">
        <input type="text" id="message-input" placeholder="Digite uma mensagem..." autocomplete="off">
        <button class="send-button" id="send-btn">➤</button>
    </div>
</div>

<!-- Modal Adicionar Contato -->
<div class="modal" id="add-contact-modal">
    <div class="modal-content">
        <h3>Adicionar Novo Contato</h3>
        <input type="email" id="new-contact-email" placeholder="E-mail do contato">
        <input type="text" id="new-contact-name" placeholder="Nome do contato (opcional)">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancel-add-contact">Cancelar</button>
            <button class="btn-confirm" id="confirm-add-contact">Adicionar</button>
        </div>
    </div>
</div>

<!-- Modal de visualização de imagem -->
<div class="image-modal" id="image-modal">
    <img id="image-modal-img" src="" alt="Imagem">
</div>

<!-- Toast de notificação -->
<div class="toast" id="toast"></div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // Configuração do Firebase
    const firebaseConfig = {        apiKey: "AIzaSyD6sVu3hsBK0AyH4jxr3lj94Hj7JAj16_g",
        authDomain: "chat-94349.firebaseapp.com",
        projectId: "chat-94349",
        storageBucket: "chat-94349.firebasestorage.app",
        messagingSenderId: "1058859014174",
        appId: "1:1058859014174:web:19d7b3ceef6f6dda1e360f"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Variáveis globais
    let currentUser = null;
    let currentChat = null;
    let contacts = [];
    let conversations = [];
    let messagesListener = null;
    let conversationsListener = null;
    let notificationSound = null;
    let messageListeners = new Map();

    // Elementos DOM
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const registerBtn = document.getElementById('register-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const addContactBtn = document.getElementById('add-contact-btn');
    const backBtn = document.getElementById('back-btn');
    const sendBtn = document.getElementById('send-btn');
    const messageInput = document.getElementById('message-input');
    const messagesArea = document.getElementById('messages-area');
    const conversationsList = document.getElementById('conversations-list');
    const addContactModal = document.getElementById('add-contact-modal');
    const cancelAddContact = document.getElementById('cancel-add-contact');
    const confirmAddContact = document.getElementById('confirm-add-contact');
    const chatMenuBtn = document.getElementById('chat-menu-btn');
    const chatMenuDropdown = document.getElementById('chat-menu-dropdown');
    const menuPhotoBtn = document.getElementById('menu-photo-btn');
    const menuAttachmentBtn = document.getElementById('menu-attachment-btn');
    const menuSoundBtn = document.getElementById('menu-sound-btn');
    const menuClearBtn = document.getElementById('menu-clear-btn');
    const photoInput = document.getElementById('photo-input');
    const attachmentInput = document.getElementById('attachment-input');    const soundInput = document.getElementById('sound-input');
    const toast = document.getElementById('toast');
    const imageModal = document.getElementById('image-modal');
    const imageModalImg = document.getElementById('image-modal-img');

    // Funções de Autenticação
    async function login() {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        if (!email || !password) {
            showError('Preencha todos os campos');
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            let message = 'Erro ao fazer login';
            if (error.code === 'auth/user-not-found') message = 'Usuário não encontrado';
            else if (error.code === 'auth/wrong-password') message = 'Senha incorreta';
            else if (error.code === 'auth/invalid-email') message = 'E-mail inválido';
            showError(message);
        }
    }

    async function register() {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        if (!email || !password) {
            showError('Preencha todos os campos');
            return;
        }

        if (password.length < 6) {
            showError('A senha deve ter no mínimo 6 caracteres');
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            
            // Registrar usuário no Firestore
            await setDoc(doc(db, "usuarios", email.replace(/\./g, '_')), {
                email: email,
                displayName: email.split('@')[0],
                createdAt: serverTimestamp(),
                contacts: []
            });        } catch (error) {
            let message = 'Erro ao criar conta';
            if (error.code === 'auth/email-already-in-use') message = 'E-mail já cadastrado';
            else if (error.code === 'auth/invalid-email') message = 'E-mail inválido';
            showError(message);
        }
    }

    async function logout() {
        try {
            await signOut(auth);
        } catch (error) {
            console.error('Erro ao sair:', error);
        }
    }

    function showError(message) {
        loginError.textContent = message;
        loginError.style.display = 'block';
        setTimeout(() => {
            loginError.style.display = 'none';
        }, 3000);
    }

    // Funções de Contato
    async function addContact() {
        const email = document.getElementById('new-contact-email').value.trim();
        const name = document.getElementById('new-contact-name').value.trim();

        if (!email) {
            alert('Digite o e-mail do contato');
            return;
        }

        if (email === currentUser.email) {
            alert('Você não pode adicionar a si mesmo');
            return;
        }

        try {
            // Verificar se o usuário existe
            const userDoc = await getDoc(doc(db, "usuarios", email.replace(/\./g, '_')));
            if (!userDoc.exists()) {
                alert('Usuário não encontrado. Certifique-se de que a pessoa já está cadastrada.');
                return;
            }

            // Adicionar contato
            const contactData = {
                email: email,                displayName: name || email.split('@')[0],
                addedAt: serverTimestamp()
            };

            // Adicionar aos contatos do usuário atual
            await setDoc(doc(db, "contatos", `${currentUser.email.replace(/\./g, '_')}_${email.replace(/\./g, '_')}`), {
                userEmail: currentUser.email,
                contactEmail: email,
                displayName: name || email.split('@')[0],
                addedAt: serverTimestamp()
            });

            // Adicionar aos contatos do outro usuário (recíproco)
            await setDoc(doc(db, "contatos", `${email.replace(/\./g, '_')}_${currentUser.email.replace(/\./g, '_')}`), {
                userEmail: email,
                contactEmail: currentUser.email,
                displayName: currentUser.email.split('@')[0],
                addedAt: serverTimestamp()
            });

            alert('Contato adicionado com sucesso!');
            closeAddContactModal();
            loadContacts();
        } catch (error) {
            console.error('Erro ao adicionar contato:', error);
            alert('Erro ao adicionar contato');
        }
    }

    function loadContacts() {
        if (!currentUser) return;

        const contactsQuery = query(
            collection(db, "contatos"),
            where("userEmail", "==", currentUser.email)
        );

        onSnapshot(contactsQuery, async (snapshot) => {
            contacts = [];
            snapshot.forEach(doc => {
                contacts.push({ id: doc.id, ...doc.data() });
            });
            loadConversations();
        });
    }

    // Funções de Conversa
    function loadConversations() {
        if (!currentUser || contacts.length === 0) {
            conversationsList.innerHTML = `                <div class="no-conversations">
                    <h3>Nenhuma conversa ainda</h3>
                    <p>Adicione contatos para começar a conversar!</p>
                </div>
            `;
            return;
        }

        conversationsList.innerHTML = '';

        contacts.forEach(contact => {
            const conversationId = getConversationId(currentUser.email, contact.contactEmail);
            
            const messagesQuery = query(
                collection(db, "conversas", conversationId, "mensagens"),
                orderBy("timestamp", "desc")
            );

            const itemDiv = document.createElement('div');
            itemDiv.className = 'conversation-item';
            itemDiv.setAttribute('data-contact-email', contact.contactEmail);
            itemDiv.onclick = () => openChat(contact);

            const avatar = document.createElement('div');
            avatar.className = 'conversation-avatar';
            avatar.textContent = contact.displayName.charAt(0).toUpperCase();

            const infoDiv = document.createElement('div');
            infoDiv.className = 'conversation-info';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'conversation-name';
            nameDiv.textContent = contact.displayName;

            const lastMsgDiv = document.createElement('div');
            lastMsgDiv.className = 'conversation-last-message';
            lastMsgDiv.textContent = 'Carregando...';

            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(lastMsgDiv);

            itemDiv.appendChild(avatar);
            itemDiv.appendChild(infoDiv);
            conversationsList.appendChild(itemDiv);

            // Listener para última mensagem e notificações
            if (messageListeners.has(contact.contactEmail)) {
                messageListeners.get(contact.contactEmail)();
            }
            const unsubscribe = onSnapshot(messagesQuery, (snapshot) => {
                if (!snapshot.empty) {
                    const lastMsg = snapshot.docs[0].data();
                    let preview = lastMsg.texto || '';
                    if (lastMsg.tipo === 'image') preview = '📷 Foto';
                    else if (lastMsg.tipo === 'file') preview = '📎 ' + (lastMsg.fileName || 'Arquivo');
                    
                    lastMsgDiv.textContent = preview;

                    // Verificar se é mensagem não lida (recebida de outro usuário)
                    if (lastMsg.enviadoPor !== currentUser.email && currentChat?.contactEmail !== contact.contactEmail) {
                        // Tocar som de notificação
                        playNotificationSound();
                        
                        // Fazer o nome piscar
                        nameDiv.classList.add('blinking');
                        
                        // Mostrar toast
                        showToast(`💬 Nova mensagem de ${contact.displayName}`);
                    }
                } else {
                    lastMsgDiv.textContent = 'Nenhuma mensagem ainda';
                }
            });

            messageListeners.set(contact.contactEmail, unsubscribe);
        });
    }

    // Funções de Chat
    function openChat(contact) {
        currentChat = contact;
        
        document.getElementById('chat-avatar').textContent = contact.displayName.charAt(0).toUpperCase();
        document.getElementById('chat-contact-name').textContent = contact.displayName;
        document.getElementById('chat-contact-status').textContent = 'online';

        // Remover animação de piscar
        const contactItem = document.querySelector(`[data-contact-email="${contact.contactEmail}"] .conversation-name`);
        if (contactItem) {
            contactItem.classList.remove('blinking');
        }

        mainScreen.classList.remove('active');
        chatScreen.classList.add('active');

        loadMessages();
        messageInput.focus();
    }
    function closeChat() {
        if (messagesListener) {
            messagesListener();
            messagesListener = null;
        }
        currentChat = null;
        chatScreen.classList.remove('active');
        mainScreen.classList.add('active');
        closeChatMenu();
    }

    function loadMessages() {
        if (!currentUser || !currentChat) return;

        const conversationId = getConversationId(currentUser.email, currentChat.contactEmail);
        const messagesQuery = query(
            collection(db, "conversas", conversationId, "mensagens"),
            orderBy("timestamp", "asc")
        );

        messagesArea.innerHTML = '';

        messagesListener = onSnapshot(messagesQuery, (snapshot) => {
            messagesArea.innerHTML = '';

            if (snapshot.empty) {
                messagesArea.innerHTML = '<div class="no-conversations"><p>Envie uma mensagem para começar!</p></div>';
                return;
            }

            snapshot.forEach(doc => {
                const message = doc.data();
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${message.enviadoPor === currentUser.email ? 'sent' : 'received'}`;

                // Renderizar conteúdo baseado no tipo
                if (message.tipo === 'image') {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = message.imageData;
                    img.onclick = () => showImageModal(message.imageData);
                    messageDiv.appendChild(img);
                } else if (message.tipo === 'file') {
                    const fileLink = document.createElement('a');
                    fileLink.className = 'message-file';
                    fileLink.href = message.fileData;
                    fileLink.download = message.fileName;
                    
                    const icon = document.createElement('div');
                    icon.className = 'message-file-icon';                    icon.textContent = '📄';
                    
                    const info = document.createElement('div');
                    info.className = 'message-file-info';
                    
                    const name = document.createElement('div');
                    name.className = 'message-file-name';
                    name.textContent = message.fileName;
                    
                    const size = document.createElement('div');
                    size.className = 'message-file-size';
                    size.textContent = formatFileSize(message.fileSize);
                    
                    info.appendChild(name);
                    info.appendChild(size);
                    
                    fileLink.appendChild(icon);
                    fileLink.appendChild(info);
                    messageDiv.appendChild(fileLink);
                }

                if (message.texto) {
                    const textDiv = document.createElement('div');
                    textDiv.className = 'message-text';
                    textDiv.textContent = message.texto;
                    messageDiv.appendChild(textDiv);
                }

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                const time = message.timestamp ? message.timestamp.toDate() : new Date();
                timeDiv.textContent = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                messageDiv.appendChild(timeDiv);

                messagesArea.appendChild(messageDiv);
            });

            messagesArea.scrollTop = messagesArea.scrollHeight;
        });
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !currentChat) return;

        const conversationId = getConversationId(currentUser.email, currentChat.contactEmail);

        try {
            await addDoc(collection(db, "conversas", conversationId, "mensagens"), {
                texto: text,                tipo: 'text',
                enviadoPor: currentUser.email,
                timestamp: serverTimestamp()
            });
            messageInput.value = '';
        } catch (error) {
            console.error('Erro ao enviar mensagem:', error);
            alert('Erro ao enviar mensagem');
        }
    }

    // Funções do Menu
    function toggleChatMenu() {
        chatMenuDropdown.classList.toggle('active');
    }

    function closeChatMenu() {
        chatMenuDropdown.classList.remove('active');
    }

    async function clearMessages() {
        if (!currentChat) return;

        if (!confirm('Tem certeza que deseja apagar todas as mensagens desta conversa?')) {
            return;
        }

        const conversationId = getConversationId(currentUser.email, currentChat.contactEmail);

        try {
            const messagesQuery = query(
                collection(db, "conversas", conversationId, "mensagens")
            );

            const snapshot = await getDocs(messagesQuery);
            
            const deletePromises = [];
            snapshot.forEach(doc => {
                deletePromises.push(deleteDoc(doc.ref));
            });

            await Promise.all(deletePromises);
            showToast('✅ Mensagens apagadas com sucesso!');
            closeChatMenu();
        } catch (error) {
            console.error('Erro ao limpar mensagens:', error);
            alert('Erro ao limpar mensagens');
        }
    }
    // Funções de Foto
    async function handlePhotoSelect(event) {
        const file = event.target.files[0];
        if (!file || !currentChat) return;

        if (!file.type.startsWith('image/')) {
            alert('Selecione um arquivo de imagem válido');
            return;
        }

        // Verificar tamanho (máx 5MB para base64)
        if (file.size > 5 * 1024 * 1024) {
            alert('Imagem muito grande. Máximo 5MB.');
            return;
        }

        try {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const imageData = e.target.result;
                const conversationId = getConversationId(currentUser.email, currentChat.contactEmail);

                await addDoc(collection(db, "conversas", conversationId, "mensagens"), {
                    tipo: 'image',
                    imageData: imageData,
                    enviadoPor: currentUser.email,
                    timestamp: serverTimestamp()
                });

                showToast('📷 Foto enviada!');
                closeChatMenu();
            };
            reader.readAsDataURL(file);
        } catch (error) {
            console.error('Erro ao enviar foto:', error);
            alert('Erro ao enviar foto');
        }

        event.target.value = '';
    }

    // Funções de Anexo
    async function handleAttachmentSelect(event) {
        const file = event.target.files[0];
        if (!file || !currentChat) return;

        // Verificar tamanho (máx 10MB)
        if (file.size > 10 * 1024 * 1024) {
            alert('Arquivo muito grande. Máximo 10MB.');
            return;        }

        try {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const fileData = e.target.result;
                const conversationId = getConversationId(currentUser.email, currentChat.contactEmail);

                await addDoc(collection(db, "conversas", conversationId, "mensagens"), {
                    tipo: 'file',
                    fileData: fileData,
                    fileName: file.name,
                    fileType: file.type,
                    fileSize: file.size,
                    enviadoPor: currentUser.email,
                    timestamp: serverTimestamp()
                });

                showToast('📎 Arquivo enviado!');
                closeChatMenu();
            };
            reader.readAsDataURL(file);
        } catch (error) {
            console.error('Erro ao enviar arquivo:', error);
            alert('Erro ao enviar arquivo');
        }

        event.target.value = '';
    }

    // Funções de Som de Notificação
    function handleSoundSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('audio/')) {
            alert('Selecione um arquivo de áudio válido');
            return;
        }

        // Verificar tamanho (máx 3MB para localStorage)
        if (file.size > 3 * 1024 * 1024) {
            alert('Arquivo muito grande. Máximo 3MB.');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const audioData = e.target.result;
            localStorage.setItem('notificationSound', audioData);            notificationSound = new Audio(audioData);
            notificationSound.volume = 0.7;
            showToast('🔔 Som de notificação atualizado!');
            closeChatMenu();
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function loadNotificationSound() {
        const savedSound = localStorage.getItem('notificationSound');
        if (savedSound) {
            notificationSound = new Audio(savedSound);
            notificationSound.volume = 0.7;
        } else {
            // Som padrão (beep curto)
            const defaultSound = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            notificationSound = new Audio(defaultSound);
            notificationSound.volume = 0.5;
        }
    }

    function playNotificationSound() {
        if (!notificationSound) return;
        
        notificationSound.currentTime = 0;
        notificationSound.play().catch(e => {
            console.log('Autoplay bloqueado:', e);
            // Tentar novamente após interação do usuário
            const unlock = () => {
                notificationSound.play().catch(() => {});
                ['click', 'touchstart', 'keydown'].forEach(evt => 
                    document.removeEventListener(evt, unlock)
                );
            };
            ['click', 'touchstart', 'keydown'].forEach(evt => 
                document.addEventListener(evt, unlock, { once: true })
            );
        });
    }

    // Funções auxiliares
    function getConversationId(user1, user2) {
        return [user1, user2].sort().join('_');
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function showImageModal(imageSrc) {
        imageModalImg.src = imageSrc;
        imageModal.classList.add('active');
    }

    function closeImageModal() {
        imageModal.classList.remove('active');
    }

    function showLoginScreen() {
        loginScreen.style.display = 'flex';
        mainScreen.classList.remove('active');
        chatScreen.classList.remove('active');
    }

    function showMainScreen() {
        loginScreen.style.display = 'none';
        mainScreen.classList.add('active');
        chatScreen.classList.remove('active');
    }

    function openAddContactModal() {
        addContactModal.classList.add('active');
    }

    function closeAddContactModal() {
        addContactModal.classList.remove('active');
        document.getElementById('new-contact-email').value = '';
        document.getElementById('new-contact-name').value = '';
    }

    // Event Listeners
    loginBtn.onclick = login;
    registerBtn.onclick = register;
    logoutBtn.onclick = logout;
    addContactBtn.onclick = openAddContactModal;
    backBtn.onclick = closeChat;
    sendBtn.onclick = sendMessage;    cancelAddContact.onclick = closeAddContactModal;
    confirmAddContact.onclick = addContact;
    chatMenuBtn.onclick = toggleChatMenu;
    menuClearBtn.onclick = clearMessages;
    imageModal.onclick = closeImageModal;

    menuPhotoBtn.onclick = () => photoInput.click();
    menuAttachmentBtn.onclick = () => attachmentInput.click();
    menuSoundBtn.onclick = () => soundInput.click();

    photoInput.addEventListener('change', handlePhotoSelect);
    attachmentInput.addEventListener('change', handleAttachmentSelect);
    soundInput.addEventListener('change', handleSoundSelect);

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Fechar menu ao clicar fora
    document.addEventListener('click', (e) => {
        if (!chatMenuDropdown.contains(e.target) && e.target !== chatMenuBtn) {
            closeChatMenu();
        }
    });

    // Monitorar estado de autenticação
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            showMainScreen();
            loadNotificationSound();
            loadContacts();
        } else {
            currentUser = null;
            showLoginScreen();
            // Limpar listeners
            messageListeners.forEach(unsubscribe => unsubscribe());
            messageListeners.clear();
        }
    });

    console.log('✅ WhatsApp Clone carregado com sucesso!');
</script>

</body>
