    <!-- Service Worker para PWA e Notificações -->
    <script>
        // Registrar Service Worker para notificações em background
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (event) => {
                        self.clients.claim();
                    });
                    self.addEventListener('notificationclick', (event) => {
                        event.notification.close();
                        event.waitUntil(
                            clients.matchAll({ type: 'window', includeUncontrolled: true })
                                .then((clientList) => {
                                    for (const client of clientList) {
                                        if (client.url.includes(location.pathname) && 'focus' in client) {
                                            return client.focus();
                                        }
                                    }
                                    if (clients.openWindow) {
                                        return clients.openWindow('/');
                                    }
                                })
                        );
                    });
                    self.addEventListener('push', (event) => {
                        const data = event.data?.json() || {};
                        const title = data.title || '💬 Nova Mensagem';
                        const options = {
                            body: data.body || 'Você recebeu uma nova mensagem no Chat Moderno',
                            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23075e54"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="white">💬</text></svg>',
                            tag: 'chat-message',
                            renotify: true,
                            requireInteraction: true,
                            actions: [{ action: 'open', title: 'Abrir Chat' }]
                        };
                        event.waitUntil(self.registration.showNotification(title, options));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).then(registration => {
                    console.log('✅ Service Worker registrado');
                    window.swRegistration = registration;
                }).catch(error => console.log('❌ Falha no Service Worker:', error));
            });
        }
    </script>

        // ========== SOM E NOTIFICAÇÕES ==========
        function loadNotificationSound() {
            const savedSound = localStorage.getItem('notificationSound');
            if (savedSound) {
                notificationSound = new Audio(savedSound);
                notificationSound.volume = 0.7;
            } else {
                const defaultSound = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
                notificationSound = new Audio(defaultSound);
                notificationSound.volume = 0.5;
            }
        }
        
        function playNotificationSound() {
            if (!notificationSound) return;
            notificationSound.currentTime = 0;
            notificationSound.play().catch(e => {
                const unlock = () => {
                    notificationSound.play().catch(() => {});
                    ['click', 'touchstart', 'keydown'].forEach(evt => document.removeEventListener(evt, unlock));
                };
                ['click', 'touchstart', 'keydown'].forEach(evt => document.addEventListener(evt, unlock, { once: true }));
            });
        }
        
        window.selectNotificationSound = function() {
            document.getElementById('sound-file-input').click();
        };
        
        function handleSoundFile(file) {
            if (!file) return;
            if (!file.type.startsWith('audio/')) {
                showToast('Selecione um arquivo de áudio válido');
                return;
            }
            if (file.size > 3 * 1024 * 1024) {
                showToast('Arquivo muito grande. Máximo 3MB.');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('notificationSound', e.target.result);
                notificationSound = new Audio(e.target.result);
                notificationSound.volume = 0.7;
                showToast('🔔 Som de notificação alterado! Clique em "Fixar Som" para confirmar.');
                playNotificationSound();
            };
            reader.onerror = () => showToast('Erro ao carregar arquivo');
            reader.readAsDataURL(file);
        }
        
        // NOVO BOTÃO FIXAR SOM: refixa o som atual (salvo no localStorage) e garante que será tocado nas mensagens
        window.fixNotificationSound = function() {
            const savedSound = localStorage.getItem('notificationSound');
            if (savedSound) {
                notificationSound = new Audio(savedSound);
                notificationSound.volume = 0.7;
                showToast('📌 Som de notificação fixado com sucesso! ✅');
                playNotificationSound();
            } else {
                showToast('⚠️ Nenhum som personalizado encontrado. Use "Som de Notificação" primeiro.');
            }
        };
        
        async function requestNotificationPermission() {
            if (!('Notification' in window)) return false;
            if (Notification.permission === 'granted') return true;
            if (Notification.permission !== 'denied') {
                const permission = await Notification.requestPermission();
                return permission === 'granted';
            }
            return false;
        }
        
        function showSystemNotification(title, body, contactName) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            if (window.isPageVisible && currentContact === contactName) return;
            const icon = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23075e54"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="white">💬</text></svg>';
            const notification = new Notification(title, { body: body, icon: icon, tag: `chat-${contactName}`, renotify: true });
            notification.onclick = function() {
                window.focus();
                if (currentContact !== contactName && friendsList.includes(contactName)) {
                    startChatFromMain(contactName, friendlyNameMap[contactName] || contactName.split('@')[0]);
                }
            };
            setTimeout(() => notification.close(), 5000);
        }
        
        function showToast(message) {
            let toast = document.getElementById('notification-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'notification-toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // ========== FUNÇÕES DE AMIZADE E MENSAGENS ==========
        async function userExists(email) {
            const usersRef = collection(db, "usuarios");
            const q = query(usersRef, where("email", "==", email));
            const snapshot = await getDocs(q);
            return !snapshot.empty;
        }
        
        window.sendFriendRequest = async function() {
            if (!currentUserEmail) { alert("Faça login primeiro!"); return; }
            const friendEmail = prompt("Digite o e-mail do seu amigo:");
            if (!friendEmail || friendEmail.trim() === "") return;
            const emailTrimmed = friendEmail.trim();
            if (emailTrimmed === currentUserEmail) { alert("Você não pode enviar solicitação para si mesmo."); return; }
            if (friendsList.includes(emailTrimmed)) { alert("Você já é amigo(a) desta pessoa!"); return; }
            
            const requestsRef = collection(db, "solicitacoes");
            const existingQuery = query(requestsRef, where("remetente", "==", currentUserEmail), where("destinatario", "==", emailTrimmed), where("status", "==", "pendente"));
            const existingSnap = await getDocs(existingQuery);
            if (!existingSnap.empty) { alert("Você já enviou uma solicitação para este e-mail."); return; }
            
            const reverseQuery = query(requestsRef, where("remetente", "==", emailTrimmed), where("destinatario", "==", currentUserEmail), where("status", "==", "pendente"));
            const reverseSnap = await getDocs(reverseQuery);
            if (!reverseSnap.empty) { alert("Este usuário já te enviou uma solicitação. Aceite-a primeiro."); return; }
            
            const exists = await userExists(emailTrimmed);
            if (!exists) { alert("Usuário não encontrado."); return; }
            
            await addDoc(collection(db, "solicitacoes"), {
                remetente: currentUserEmail, destinatario: emailTrimmed, status: "pendente",
                timestamp: serverTimestamp(), remetenteNome: currentUserDisplayName || currentUserEmail.split('@')[0]
            });
            alert(`Solicitação enviada para ${emailTrimmed}!`);
        };
        
        window.acceptRequest = async function(requestId, remetenteEmail, remetenteNome) {
            const requestRef = doc(db, "solicitacoes", requestId);
            await updateDoc(requestRef, { status: "aceito" });
            const friendshipId = [currentUserEmail, remetenteEmail].sort().join('_');
            await setDoc(doc(db, "amizades", friendshipId), { usuarios: [currentUserEmail, remetenteEmail], criadoEm: serverTimestamp(), status: "ativa" });
            alert(`Agora você é amigo(a) de ${remetenteNome || remetenteEmail.split('@')[0]}!`);
            loadFriendsAndContacts();
        };
        
        window.rejectRequest = async function(requestId) {
            await deleteDoc(doc(db, "solicitacoes", requestId));
            alert("Solicitação recusada.");
        };
        
        function loadPendingRequests() {
            if (!currentUserEmail) return;
            if (pendingRequestsListener) pendingRequestsListener();
            const q = query(collection(db, "solicitacoes"), where("destinatario", "==", currentUserEmail), where("status", "==", "pendente"));
            pendingRequestsListener = onSnapshot(q, (snapshot) => {
                const requests = []; snapshot.forEach(doc => requests.push({ id: doc.id, ...doc.data() }));
                const count = requests.length;
                notificationBadge.style.display = count ? 'flex' : 'none';
                if (count) notificationBadge.textContent = count > 9 ? '9+' : count;
                notificationList.innerHTML = requests.length ? '' : '<div class="no-requests">Nenhuma solicitação pendente</div>';
                requests.forEach(req => {
                    const nomeExib = req.remetenteNome || req.remetente.split('@')[0];
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `
                        <div class="request-info"><div class="request-name">${escapeHtml(nomeExib)}</div><div class="request-email">${escapeHtml(req.remetente)}</div></div>
                        <div class="request-actions"><button class="accept-btn" onclick="window.acceptRequest('${req.id}', '${req.remetente}', '${nomeExib}')">Aceitar</button><button class="reject-btn" onclick="window.rejectRequest('${req.id}')">Recusar</button></div>
                    `;
                    notificationList.appendChild(div);
                });
            });
        }
        
        async function loadFriendsAndContacts() {
            if (!currentUserEmail) return;
            const amigosSet = new Set();
            const snapshot = await getDocs(query(collection(db, "amizades"), where("usuarios", "array-contains", currentUserEmail)));
            snapshot.forEach(doc => {
                const outro = doc.data().usuarios.find(u => u !== currentUserEmail);
                if (outro) amigosSet.add(outro);
            });
            friendsList = Array.from(amigosSet);
            for (const email of friendsList) {
                if (!friendlyNameMap[email]) {
                    const userDoc = await getDoc(doc(db, "usuarios", email.replace(/\./g, '_')));
                    friendlyNameMap[email] = userDoc.exists() ? (userDoc.data().displayName || email.split('@')[0]) : email.split('@')[0];
                }
                startUnreadListener(email, friendlyNameMap[email]);
            }
            renderFriendsList();
        }
        
        function renderFriendsList() {
            const container = document.getElementById('contact-list-main');
            if (!container) return;
            if (!friendsList.length) { container.innerHTML = '<div class="no-results">😊 Nenhum amigo ainda. Adicione amigos!</div>'; return; }
            const contacts = friendsList.map(email => ({ email, name: friendlyNameMap[email] || email.split('@')[0], initial: (friendlyNameMap[email] || email.split('@')[0]).charAt(0).toUpperCase() }));
            renderContactsList(contacts);
        }
        
        function renderContactsList(contacts) {
            const container = document.getElementById('contact-list-main');
            container.innerHTML = '';
            if (!contacts.length) { container.innerHTML = '<div class="no-results">🔍 Nenhum amigo encontrado</div>'; return; }
            contacts.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'contact-item-main';
                div.setAttribute('data-email', contact.email);
                div.innerHTML = `<div class="contact-avatar">${contact.initial}</div><div class="contact-info"><div class="contact-name-main">${escapeHtml(contact.name)}</div><div class="contact-email-main">${escapeHtml(contact.email)}</div></div>`;
                div.onclick = () => { markAsRead(contact.email); startChatFromMain(contact.email, contact.name); };
                container.appendChild(div);
                if (blinkingContacts.has(contact.email)) div.classList.add('blinking');
            });
        }
        
        function startUnreadListener(contactEmail, contactName) {
            if (!currentUserEmail) return;
            if (unreadListeners.has(contactEmail)) unreadListeners.get(contactEmail)();
            const conversationId = [currentUserEmail, contactEmail].sort().join('_');
            const q = query(collection(db, "conversas", conversationId, "mensagens"), orderBy("timestamp", "desc"));
            const lastReadRef = doc(db, "leituras", `${currentUserEmail}_${contactEmail}`);
            const unsub = onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) return;
                const lastMsg = snapshot.docs[0].data();
                if (lastMsg.enviadoPor === currentUserEmail) { stopBlinking(contactEmail); return; }
                const lastReadDoc = await getDoc(lastReadRef);
                let needBlink = true;
                if (lastReadDoc.exists() && lastMsg.timestamp) {
                    needBlink = lastMsg.timestamp.toDate() > lastReadDoc.data().lastRead?.toDate();
                }
                if (needBlink && currentContact !== contactEmail) {
                    if (!blinkingContacts.has(contactEmail)) {
                        blinkingContacts.add(contactEmail);
                        const el = document.querySelector(`.contact-item-main[data-email="${contactEmail}"]`);
                        if (el) el.classList.add('blinking');
                        playNotificationSound();
                        const senderName = friendlyNameMap[lastMsg.enviadoPor] || lastMsg.enviadoPor.split('@')[0];
                        const preview = lastMsg.texto?.substring(0, 50);
                        if (Notification.permission === 'granted') showSystemNotification(`💬 ${senderName}`, preview || 'Nova mensagem', contactEmail);
                        else showToast(`🔔 ${senderName}: ${preview || 'Nova mensagem'}`);
                    }
                } else { stopBlinking(contactEmail); }
            });
            unreadListeners.set(contactEmail, unsub);
        }
        
        function stopBlinking(email) {
            if (blinkingContacts.has(email)) {
                blinkingContacts.delete(email);
                const el = document.querySelector(`.contact-item-main[data-email="${email}"]`);
                if (el) el.classList.remove('blinking');
            }
        }
        
        async function markAsRead(contactEmail) {
            if (!currentUserEmail || !contactEmail) return;
            await setDoc(doc(db, "leituras", `${currentUserEmail}_${contactEmail}`), { lastRead: serverTimestamp(), updatedAt: serverTimestamp() });
            stopBlinking(contactEmail);
        }
        
        function startChatFromMain(email, name) {
            if (!currentUserEmail) return;
            markAsRead(email);
            currentContact = email;
            chatTitle.innerText = name;
            mainScreen.classList.add('hidden');
            chatContainer.classList.remove('hidden');
            loadMessages(email);
            messageInput.focus();
        }
        
        function loadMessages(contactEmail) {
            if (unsubscribe) unsubscribe();
            const conversationId = [currentUserEmail, contactEmail].sort().join('_');
            const q = query(collection(db, "conversas", conversationId, "mensagens"), orderBy("timestamp", "asc"));
            chatArea.innerHTML = "";
            unsubscribe = onSnapshot(q, (snapshot) => {
                chatArea.innerHTML = "";
                if (snapshot.empty) {
                    const empty = document.createElement('p');
                    empty.style.cssText = "text-align:center;color:#777;margin-top:20px";
                    empty.innerText = "Nenhuma mensagem ainda. Envie um olá!";
                    chatArea.appendChild(empty);
                } else {
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        const div = document.createElement('div');
                        const timeStr = data.timestamp?.toDate().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) || '';
                        if (data.enviadoPor === currentUserEmail) {
                            div.className = 'message';
                            div.innerHTML = `${escapeHtml(data.texto)}<small>${timeStr}</small>`;
                        } else {
                            const nome = friendlyNameMap[data.enviadoPor] || data.enviadoPor.split('@')[0];
                            div.className = 'message received';
                            div.innerHTML = `<strong>${escapeHtml(nome)}</strong><span>${escapeHtml(data.texto)}</span><small>${timeStr}</small>`;
                        }
                        chatArea.appendChild(div);
                    });
                }
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }
        
        window.sendMessage = async function() {
            if (!currentUserEmail || !currentContact) { alert("Selecione um contato"); return; }
            const text = messageInput.value.trim();
            if (!text) return;
            const conversationId = [currentUserEmail, currentContact].sort().join('_');
            await addDoc(collection(db, "conversas", conversationId, "mensagens"), {
                texto: text, timestamp: serverTimestamp(), enviadoPor: currentUserEmail,
                nomeExibicao: currentUserDisplayName || currentUserEmail.split('@')[0]
            });
            messageInput.value = "";
        };
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&', '<':'<', '>':'>' }[m])); }
        
        window.goToMainScreen = function() {
            if (!currentUserEmail) return;
            if (unsubscribe) unsubscribe();
            if (currentContact) markAsRead(currentContact);
            currentContact = null;
            chatTitle.innerText = "Chat";
            chatContainer.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            renderFriendsList();
        };
        window.filterContacts = function(term) {
            if (!term.trim()) { renderFriendsList(); return; }
            const filtered = friendsList.filter(email => {
                const name = (friendlyNameMap[email] || email.split('@')[0]).toLowerCase();
                return name.includes(term.toLowerCase()) || email.toLowerCase().includes(term.toLowerCase());
            }).map(email => ({ email, name: friendlyNameMap[email] || email.split('@')[0], initial: (friendlyNameMap[email] || email.split('@')[0]).charAt(0).toUpperCase() }));
            renderContactsList(filtered);
        };
        window.clearSearch = function() { document.getElementById('search-input').value = ''; renderFriendsList(); };
        window.toggleNotificationPanel = function() { notificationPanel.classList.toggle('show'); };
        window.toggleSettingsMenu = function() { document.getElementById('settings-menu').classList.toggle('show'); };
        
        window.logout = async function() {
            for (const [_, fn] of unreadListeners) fn();
            if (pendingRequestsListener) pendingRequestsListener();
            await signOut(auth);
            if (unsubscribe) unsubscribe();
            currentContact = null;
            currentUserEmail = null;
            chatContainer.classList.add('hidden');
            mainScreen.classList.add('hidden');
            authScreen.style.display = 'flex';
            document.getElementById('settings-menu').classList.remove('show');
            notificationPanel.classList.remove('show');
        };
        
        // Autenticação
        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            authTitle.textContent = isLoginMode ? 'Login' : 'Cadastro';
            authSubmitBtn.textContent = isLoginMode ? 'Entrar' : 'Cadastrar';
            authToggleBtn.textContent = isLoginMode ? 'Criar nova conta' : 'Já tenho uma conta';
            authConfirmPassword.style.display = isLoginMode ? 'none' : 'block';
            authConfirmPassword.required = !isLoginMode;
        };
        window.submitAuth = async function() {
            const email = authEmail.value.trim();
            const password = authPassword.value;
            const confirm = authConfirmPassword.value;
            if (!email || !password) { showError('Preencha e-mail e senha.'); return; }
            if (!isLoginMode && password !== confirm) { showError('Senhas não coincidem.'); return; }
            if (password.length < 6) { showError('Senha mínima 6 caracteres.'); return; }
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
                showSuccess(isLoginMode ? 'Login realizado!' : 'Cadastro realizado!');
            } catch (error) {
                let msg = 'Erro. ';
                if (error.code === 'auth/email-already-in-use') msg = 'E-mail já cadastrado.';
                else if (error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
                else if (error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
                else msg = error.message;
                showError(msg);
            }
        };
        function showError(msg) { authError.textContent = msg; authError.style.display = 'block'; setTimeout(() => authError.style.display = 'none', 4000); }
        function showSuccess(msg) { authSuccess.textContent = msg; authSuccess.style.display = 'block'; setTimeout(() => authSuccess.style.display = 'none', 3000); }
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                currentUserDisplayName = user.email.split('@')[0];
                await setDoc(doc(db, "usuarios", currentUserEmail.replace(/\./g, '_')), { email: currentUserEmail, displayName: currentUserDisplayName, lastSeen: serverTimestamp() }, { merge: true });
                authScreen.style.display = 'none';
                mainScreen.classList.remove('hidden');
                chatContainer.classList.add('hidden');
                loadNotificationSound();
                loadFriendsAndContacts();
                loadPendingRequests();
                if (Notification.permission === 'default') setTimeout(() => requestNotificationPermission(), 2000);
            } else {
                for (const [_, fn] of unreadListeners) fn();
                unreadListeners.clear();
                blinkingContacts.clear();
                if (pendingRequestsListener) pendingRequestsListener();
                friendsList = [];
                currentUserEmail = null;
                if (unsubscribe) unsubscribe();
                authScreen.style.display = 'flex';
                mainScreen.classList.add('hidden');
                chatContainer.classList.add('hidden');
                notificationBadge.style.display = 'none';
                if (!isLoginMode) window.toggleAuthMode();
            }
        });
        
        document.getElementById('auth-submit-btn').onclick = () => window.submitAuth();
        document.getElementById('auth-toggle-btn').onclick = () => window.toggleAuthMode();
        window.toggleAuthMode();
        document.getElementById('message-input')?.addEventListener('keypress', e => { if(e.key === 'Enter') window.sendMessage(); });
        document.getElementById('sound-file-input')?.addEventListener('change', e => handleSoundFile(e.target.files[0]));
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('settings-menu');
            if (menu && menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.settings-btn')) menu.classList.remove('show');
            const panel = document.getElementById('notification-panel');
            if (panel && panel.classList.contains('show') && !panel.contains(e.target) && !e.target.closest('.notification-btn')) panel.classList.remove('show');
        });
        window.isPageVisible = !document.hidden;
        document.addEventListener('visibilitychange', () => { window.isPageVisible = !document.hidden; });
        console.log("✅ Chat Moderno carregado com botão FIXAR SOM!");
    </script>
</head>
<body>
<header>
    <div style="display: flex; align-items: baseline; gap: 10px;"><span id="chat-title">Chat</span></div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <div class="notification-container">
            <div class="notification-btn" onclick="toggleNotificationPanel()">🔔<div class="notification-badge" id="notification-badge" style="display: none;">0</div></div>
            <div class="notification-panel" id="notification-panel"><div class="notification-header">Solicitações de Amizade</div><div class="notification-list" id="notification-list"><div class="no-requests">Nenhuma solicitação pendente</div></div></div>
        </div>
        <div class="back-btn" onclick="goToMainScreen()">⬅️</div>
        <div class="settings-container">
            <div class="settings-btn" onclick="toggleSettingsMenu()">⚙️</div>
            <div id="settings-menu" class="settings-menu">
                <div class="settings-menu-item" onclick="sendFriendRequest()">➕ Adicionar Amigo</div>
                <div class="settings-menu-item" onclick="selectNotificationSound()">🔔 Som de Notificação<input type="file" id="sound-file-input" accept="audio/*"></div>
                <div class="settings-menu-item" onclick="fixNotificationSound()">📌 Fixar Som</div>
                <div class="settings-menu-item danger" onclick="logout()">🚪 Sair</div>
            </div>
        </div>
    </div>
</header>
<div id="main-screen" class="main-screen hidden">
    <h2>💬 Seus Amigos</h2>
    <div class="search-container"><input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar amigo..." onkeyup="filterContacts(this.value)"><span class="search-icon">🔍</span><span class="clear-search" onclick="clearSearch()">✖</span></div>
    <div id="contact-list-main" class="contact-list-main"></div>
    <button class="add-friend-btn" onclick="sendFriendRequest()">➕ Adicionar amigo por e-mail</button>
</div>
<div id="chat-container" class="hidden">
    <div id="chat-area"><p style="text-align: center; color: #777; margin-top: 20px;">Selecione um contato para começar</p></div>
    <div class="input-area"><input type="text" id="message-input" placeholder="Digite uma mensagem..."><button id="send-btn" onclick="sendMessage()">Enviar</button></div>
</div>
<div id="auth-screen">
    <div class="auth-container"><h2 id="auth-title">Login</h2><input type="email" id="auth-email" placeholder="E-mail"><input type="password" id="auth-password" placeholder="Senha"><input type="password" id="auth-confirm-password" placeholder="Confirmar senha" style="display: none;"><div id="auth-error" class="error-msg"></div><div id="auth-success" class="success-msg"></div><button id="auth-submit-btn">Entrar</button><button id="auth-toggle-btn" class="toggle-btn">Criar nova conta</button><p>🔒 Chat seguro - Envie solicitações de amizade!</p></div>
</div>
</body>
</html>
